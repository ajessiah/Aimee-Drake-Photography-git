<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Aimee Drake Photography</title>
    <script src="https://kit.fontawesome.com/31bce71fcd.js" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
  </head>
  <body class="bg-black">
    <nav id="header-div" class="navbar navbar-expand-lg bg-black">
      <div class="container">
        <a id="logo-container" class="navbar-brand" href="#" title="Aimee Drake Photography Home Button">
            <img src="..\Static Media\Black & Gold Logo.png" class="logo" alt="Aimee Drake Photography Logo">
        </a>
        <button id="hamburger-btn" class="navbar-toggler" type="button" title="Hamburger Menu Button" data-bs-toggle="collapse" data-bs-target="#nav-menu">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="nav-menu">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a id="home-btn" class="nav-link text-light text-uppercase menu-btn" href="#">Home</a></li>
                <li class="nav-item"><a id="about-btn" class="nav-link text-light text-uppercase menu-btn" href="#">About</a></li>
                <li class="nav-item"><a id="portfolio-btn" class="nav-link text-light text-uppercase menu-btn" href="#">Portfolio</a></li>
                <li class="nav-item"><a id="rates-btn" class="nav-link text-light text-uppercase menu-btn" href="#">Rates</a></li>
                <li class="nav-item"><a id="contact-btn" class="nav-link text-light text-uppercase menu-btn" href="#">Contact</a></li>
            </ul>
        </div>
      </div>
    </nav>
    <section class="py-3 page-main bg-black">
      <div id="page-title" class="container text-center">
        <h2 id='page-title-text' class="text-white">CONTACT</h2>
        <div class="underline"></div>
      </div>
      <div id="page-content" class="container-fluid">
        <div id="contact-container" class="container">
            <div id="contact-btns" class="container gap-4 gap-md-1">
                <a href="tel:+15035286244">
                    <button class="button" type="button">
                        <i class="fa-solid fa-phone"></i>
                        <p class="d-none d-md-inline">503.528.6244</p>
                    </button>
                </a>
                <a href="mailto:aimee@aimeedrake.com">
                    <button class="button" type="button">
                        <i class="fa-solid fa-envelope"></i>
                        <p class="d-none d-md-inline">aimee@aimeedrake.com</p>
                    </button>
                </a>
            </div>
            <div class="container">
                <button id="contact-form-btn" class="button contact-form-btn" data-bs-toggle="collapse" data-bs-target="#contact-form">Get In Touch</button>
                <form action="#" method="post" id="contact-form" class="collapse text-light">
                    <div id="contact-name" class="mb-3 mt-3">
                        <label for="your-name" class="form-label">Your Name</label>
                        <div id="your-name" class="row">
                            <div class="col">
                                <input type="text" id="first-name" class="form-control" placeholder="First Name" name="firstName" required>
                            </div>
                            <div class="col">
                                <input type="password" id="last-name" class="form-control" placeholder="Last Name" name="lastName" required>
                            </div>
                        </div>
                    </div>
                    <div id="contact-message" class="mb-3">
                        <label for="message" class="form-label">Your Message</label>
                        <textarea class="form-control" rows="6" id="message" name="message" placeholder="Hi, Aimee..."></textarea>
                    </div>
                    <div id="contact-preference" class="mb-3">
                        <label for="your-contact-preference" class="form-label">Preferred Contact Method</label>
                        <div id="your-contact-preference">
                            <div class="form-check">
                                <label class="form-check-label" for="pref-phone">
                                    <input type="radio" id="pref-phone" class="form-check-input" name="contact-method" value="Phone" checked>Phone
                                </label>
                            </div>
                            <div class="form-check">
                                <label class="form-check-label" for="pref-email">
                                    <input type="radio" id="pref-email" class="form-check-input" name="contact-method" value="Email">Email
                                </label>
                            </div>
                            <input type="text" id="phone-input" class="form-control" name="contact-info" placeholder="555-555-5555">
                            <input type="text" id="email-input" class="form-control" name="contact-info" placeholder="yourname@email.com">
                        </div>
                    </div>
                    <button type="submit">SUBMIT</button>
                </form>
            </div>
        </div>
        <!--WORKING
        <div id='contact-container'>

            <form action="#" method="post" id="contact-form">

                <fieldset id="contact-preference">
                <p>Preferred Contact Method</p>
                <label>
                    <input id="pref-phone" type="radio" name="contact-method" value="Phone" checked required>
                    Phone
                </label>
                <label>
                    <input id="pref-email" type="radio" name="contact-method" value="Email" required>
                    Email
                </label>
                <input type="text" id="phone-input" name="contact-info" placeholder="555-555-5555">
                <input type="text" id="email-input" name="contact-info" placeholder="yourname@email.com">
                </fieldset>

                <button type="submit">SUBMIT</button>
            </form>

        </div>  
        -->

      </div>
    </section>
    <footer class="bg-black text-primary text-center py-3">
      <div class="container">
        <div id='licensing' class="container">
          <p>
            All photos on this site are © Aimee Drake Photography. 
            Unauthorized use, copying, or distribution is prohibited. 
            Licensing or permission is required for any use beyond viewing. 
            For inquiries, contact <a href="mailto:aimee@aimeedrake.com" class="footer-link">aimee@aimeedrake.com</a>
          </p>
        </div>
        <div id="social-footer" class="container">
          <a href="tel:+15035286244">
            <button id="ham-to-phone" title="to phone" type="button"><i class="fa-solid fa-phone fa-3x"></i></button>
          </a>
          <a href="https://www.instagram.com/aimeedrake.photos/" target="_blank" rel="noopener noreferrer">
            <button id="ham-to-instagram" title="to instagram" type="button"><i class="fa-brands fa-instagram fa-4x"></i></button>
          </a>
        </div>
      </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js" type="module"></script>
  </body>
</html>
